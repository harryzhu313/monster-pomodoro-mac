<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Tomato Monster · 面板加宽与月度目标探索</title>
<style>
  /* —— 来自 src/shared/theme.css 的 token(浅色档,mockup 用)—— */
  :root {
    --primary: #d94f3a;
    --primary-strong: #c24330;
    --primary-soft: #e77b68;
    --on-primary: #ffffff;
    --success: #4a8a5c;
    --warning: #b08a3e;
    --on-neutral: #2a2a2a;
    --on-neutral-muted: #8a8a85;
    --surface-card: rgba(255, 255, 255, 0.55);
    --border-hairline: rgba(0, 0, 0, 0.08);
    --cat-work-bg: #e3ecf5;  --cat-work-fg: #3a6ea0;
    --cat-study-bg: #e6efe4; --cat-study-fg: #4a8a5c;
    --cat-life-bg: #fbefe0;  --cat-life-fg: #b07a3a;
    --cat-hobby-bg: #f3e8f5; --cat-hobby-fg: #8a5aa0;
    --current-task-bg: rgba(255, 246, 238, 0.75);
    --current-task-border: #e8b88f;
    --window-wash: rgba(246, 245, 240, 0.92);
    --font-body: -apple-system, 'SF Pro Text', 'PingFang SC', 'Noto Sans SC', sans-serif;
  }
  html, body { margin: 0; padding: 0; }

  /* —— 仿真桌面背景 + 面板窗口 —— */
  .tm-desktop {
    height: 100%;
    box-sizing: border-box;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background: linear-gradient(165deg, #f6dcba 0%, #eec092 34%, #d8cfc8 62%, #b9c9e2 100%);
    overflow: hidden;
  }
  .tm-window {
    background: var(--window-wash);
    border: 1px solid rgba(0, 0, 0, 0.10);
    border-radius: 12px;
    box-shadow: 0 18px 50px rgba(40, 30, 20, 0.28);
    overflow: hidden;
    flex: 0 0 auto;
  }
  .tm-container {
    padding: 12px 12px 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    font: 400 13px/1.5 var(--font-body);
    color: var(--on-neutral);
    -webkit-user-select: none;
    user-select: none;
  }
  .tm-card {
    background: var(--surface-card);
    border: 1px solid var(--border-hairline);
    border-radius: 10px;
    padding: 12px;
    box-sizing: border-box;
  }

  /* —— 计时卡 —— */
  .tm-timer-card { text-align: center; padding-top: 16px; }
  .tm-monster { width: 64px; height: 73px; margin: 0 auto 4px; display: block; }
  .tm-phase { font: 400 11px/1.4 var(--font-body); color: var(--on-neutral-muted); letter-spacing: .5px; margin-bottom: 4px; }
  .tm-time { font: 300 44px/1.1 var(--font-body); font-variant-numeric: tabular-nums; letter-spacing: .02em; margin-bottom: 12px; }
  .tm-btn-primary {
    display: block; width: 100%; box-sizing: border-box;
    background: var(--primary); color: var(--on-primary);
    font: 600 13px/1.5 var(--font-body);
    border: none; border-radius: 8px; padding: 8px 16px; cursor: pointer;
  }
  .tm-btn-row { display: flex; gap: 4px; margin-top: 4px; }
  .tm-btn-secondary {
    flex: 1; background: var(--surface-card); color: var(--on-neutral);
    font: 400 13px/1.5 var(--font-body);
    border: 1px solid var(--border-hairline); border-radius: 8px; padding: 8px 16px; cursor: pointer;
  }
  .tm-btn-secondary[disabled] { opacity: .4; }
  .tm-quota { font: 400 11px/1.4 var(--font-body); color: var(--on-neutral-muted); letter-spacing: .5px; margin-top: 10px; }

  /* —— 收获卡 —— */
  .tm-harvest { text-align: center; }
  .tm-harvest-label { font: 400 11px/1.4 var(--font-body); color: var(--on-neutral-muted); letter-spacing: .3px; margin-bottom: 4px; }
  .tm-harvest-icons { min-height: 22px; font-size: 16px; line-height: 1.3; margin-bottom: 4px; }
  .tm-streak { font: 500 11px/1.4 var(--font-body); color: var(--primary); letter-spacing: .3px; }

  /* —— 今日任务卡 —— */
  .tm-tasks-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .tm-tasks-title { font: 600 13px/1.4 var(--font-body); }
  .tm-badge {
    font: 400 11px/1.4 var(--font-body); color: var(--on-neutral-muted);
    background: var(--surface-card); border: 1px solid var(--border-hairline);
    padding: 2px 8px; border-radius: 9999px;
  }
  .tm-add { display: flex; gap: 4px; margin-bottom: 8px; }
  .tm-input, .tm-select, .tm-num {
    box-sizing: border-box;
    padding: 7px 8px; font: 400 12px/1.4 var(--font-body);
    border: 1px solid var(--border-hairline); border-radius: 6px;
    background: var(--surface-card); color: var(--on-neutral);
  }
  .tm-input { flex: 1; min-width: 0; }
  .tm-input::placeholder { color: var(--on-neutral-muted); }
  .tm-select { max-width: 64px; }
  .tm-num { width: 40px; text-align: center; }
  .tm-btn-add {
    background: var(--primary); color: var(--on-primary);
    font: 600 11px/1.4 var(--font-body);
    border: none; border-radius: 8px; padding: 6px 12px; cursor: pointer; flex-shrink: 0;
  }
  .tm-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .tm-empty { font: 400 11px/1.4 var(--font-body); color: var(--on-neutral-muted); opacity: .8; text-align: center; padding: 8px 0 4px; }

  /* 单行任务(现状布局) */
  .tm-task {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; background: var(--surface-card);
    border: 1px solid var(--border-hairline); border-radius: 8px; font-size: 12px;
  }
  .tm-task.cur { background: var(--current-task-bg); border-color: var(--current-task-border); }
  .tm-check { width: 14px; height: 14px; margin: 0; accent-color: var(--success); flex-shrink: 0; }
  .tm-title { flex: 1; min-width: 0; word-break: keep-all; overflow-wrap: anywhere; }
  .tm-cat {
    display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 3px;
    margin-left: 4px; letter-spacing: .3px; vertical-align: middle; white-space: nowrap;
  }
  .tm-cat.work  { background: var(--cat-work-bg);  color: var(--cat-work-fg); }
  .tm-cat.study { background: var(--cat-study-bg); color: var(--cat-study-fg); }
  .tm-cat.life  { background: var(--cat-life-bg);  color: var(--cat-life-fg); }
  .tm-cat.hobby { background: var(--cat-hobby-bg); color: var(--cat-hobby-fg); }
  .tm-toms { display: flex; gap: 1px; flex-shrink: 0; font-size: 12px; line-height: 1; }
  .tm-tom { width: 14px; height: 14px; text-align: center; line-height: 14px; position: relative; }
  .tm-tom.used { filter: grayscale(.7) brightness(.9); opacity: .7; }
  .tm-tom.used::after {
    content: '✕'; position: absolute; inset: 0; color: var(--primary);
    font-weight: 800; font-size: 14px; line-height: 14px; text-align: center;
  }
  .tm-mini-btn {
    flex-shrink: 0; border: 1px solid var(--border-hairline); background: var(--surface-card);
    color: var(--on-neutral-muted); font-size: 10px; padding: 3px 7px; border-radius: 4px;
    cursor: pointer; letter-spacing: .2px; white-space: nowrap;
  }
  .tm-mini-btn.cur-on { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .tm-del {
    flex-shrink: 0; width: 20px; height: 20px; padding: 0; font-size: 12px; line-height: 18px;
    text-align: center; border: 1px solid var(--border-hairline); background: var(--surface-card);
    color: var(--on-neutral-muted); border-radius: 4px; cursor: pointer;
  }

  /* 两行任务(W2 改良布局) */
  .tm-task2 {
    padding: 8px 10px; background: var(--surface-card);
    border: 1px solid var(--border-hairline); border-radius: 8px; font-size: 12px;
  }
  .tm-task2.cur { background: var(--current-task-bg); border-color: var(--current-task-border); }
  .tm-task2-top { display: flex; align-items: center; gap: 8px; }
  .tm-task2-bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 5px 0 0 22px; }

  /* 月度目标 chips(方案 A) */
  .tm-goal-strip { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--border-hairline); }
  .tm-goal-strip-label {
    font: 400 10px/1.4 var(--font-body); color: var(--on-neutral-muted);
    letter-spacing: .5px; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center;
  }
  .tm-goal-edit { font-size: 10px; color: var(--on-neutral-muted); cursor: pointer; text-decoration: none; }
  .tm-goal-edit:hover { color: var(--on-neutral); }
  .tm-chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .tm-chip {
    display: inline-flex; align-items: center; gap: 4px;
    font: 400 11px/1.4 var(--font-body); color: var(--on-neutral);
    padding: 3px 10px; border-radius: 9999px;
    border: 1px solid var(--border-hairline); background: var(--surface-card);
    cursor: pointer; transition: background .1s, border-color .1s;
  }
  .tm-chip:hover { border-color: rgba(0,0,0,.18); }
  .tm-chip.on {
    background: rgba(217, 79, 58, 0.10);
    border-color: rgba(217, 79, 58, 0.45);
    color: var(--primary-strong); font-weight: 500;
  }
  .tm-chip.locked { cursor: default; opacity: .75; }
  .tm-chip .tick { font-size: 10px; }
  .tm-chip .toms { font-size: 10px; color: var(--on-neutral-muted); }
  .tm-chip.on .toms { color: var(--primary-strong); opacity: .75; }

  /* 本月目标独立卡(方案 B) */
  .tm-goal-row { display: flex; align-items: center; gap: 8px; padding: 5px 2px; font-size: 12px; }
  .tm-goal-row .tm-check { accent-color: var(--primary); }
  .tm-goal-row.locked { opacity: .75; }
  .tm-goal-toms { font-size: 11px; color: var(--on-neutral-muted); flex-shrink: 0; }
  .tm-goal-hint { font: 400 10px/1.4 var(--font-body); color: var(--on-neutral-muted); opacity: .8; margin-top: 6px; }

  /* —— 底部 —— */
  .tm-footer { text-align: center; }
  .tm-ghost { background: none; border: none; font: 400 11px/1.4 var(--font-body); color: var(--on-neutral-muted); padding: 4px 8px; cursor: pointer; }
  .tm-hint { font: 400 11px/1.4 var(--font-body); color: var(--on-neutral-muted); opacity: .85; text-align: center; padding-bottom: 4px; }

  /* —— 统计与设置窗口 mock —— */
  .tm-stats-window {
    background: #eceae4;
    border: 1px solid rgba(0,0,0,.1); border-radius: 12px;
    box-shadow: 0 18px 50px rgba(40,30,20,.25);
    overflow: hidden; flex: 0 0 auto;
  }
  .tm-titlebar { display: flex; align-items: center; gap: 6px; padding: 10px 12px 6px; }
  .tm-dot { width: 11px; height: 11px; border-radius: 50%; }
  .tm-titlebar-text { flex: 1; text-align: center; font: 500 12px/1.4 var(--font-body); color: var(--on-neutral-muted); margin-right: 45px; }
  .tm-stats-body { padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 10px; font: 400 13px/1.5 var(--font-body); color: var(--on-neutral); }
  .tm-stats-card { background: rgba(255,255,255,.6); border: 1px solid var(--border-hairline); border-radius: 10px; padding: 14px 16px; }
  .tm-stats-card.ghosted { opacity: .45; padding: 10px 16px; }
  .tm-stats-card h2 { margin: 0; font: 600 14px/1.4 var(--font-body); }
  .tm-stats-sub { font: 400 11px/1.5 var(--font-body); color: var(--on-neutral-muted); margin-top: 2px; }
  .tm-manage-list { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .tm-manage-row {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,.55); border: 1px solid var(--border-hairline);
    border-radius: 8px; padding: 7px 10px; font-size: 12px;
  }
  .tm-manage-title { flex: 1; min-width: 0; }
  .tm-stepper { display: inline-flex; align-items: center; gap: 0; border: 1px solid var(--border-hairline); border-radius: 6px; overflow: hidden; flex-shrink: 0; }
  .tm-stepper button { border: none; background: var(--surface-card); width: 22px; height: 24px; cursor: pointer; color: var(--on-neutral-muted); font-size: 12px; }
  .tm-stepper span { min-width: 34px; text-align: center; font-size: 12px; font-variant-numeric: tabular-nums; background: rgba(255,255,255,.5); line-height: 24px; }
  .tm-manage-add { display: flex; gap: 6px; margin-top: 10px; }

  /* —— 任务行内番茄数步进器(新增:面板上直接改今日番茄数)—— */
  .tm-toms-edit { display: flex; align-items: center; gap: 3px; flex-shrink: 0; }
  .tm-step-btn {
    width: 17px; height: 17px; padding: 0; flex-shrink: 0;
    border: 1px solid var(--border-hairline); border-radius: 4px;
    background: var(--surface-card); color: var(--on-neutral-muted);
    font-size: 12px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .12s, color .12s, border-color .12s;
  }
  .tm-task2:hover .tm-step-btn { opacity: 1; }
  .tm-toms-edit.always .tm-step-btn { opacity: 1; }
  .tm-step-btn:hover:not(:disabled) { color: var(--on-neutral); border-color: rgba(0,0,0,.20); }
  .tm-step-btn:disabled { opacity: .22 !important; cursor: not-allowed; }
  .tm-task2:hover .tm-step-btn:disabled { opacity: .22; }

  /* 大计划数改用数值显示,不铺一排图标 */
  .tm-toms-num {
    font-size: 11px; color: var(--on-neutral-muted);
    font-variant-numeric: tabular-nums; letter-spacing: .2px; white-space: nowrap;
  }
  .tm-toms-num b { color: var(--on-neutral); font-weight: 600; }

  /* 月度进度条(把设置里的 30 读作"本月总量"时用) */
  .tm-goal-prog {
    height: 3px; border-radius: 2px; background: rgba(0,0,0,.08);
    margin-top: 5px; overflow: hidden;
  }
  .tm-goal-prog i { display: block; height: 100%; background: var(--primary); opacity: .55; }
  .tm-chip .prog { font-size: 10px; color: var(--on-neutral-muted); font-variant-numeric: tabular-nums; }
  .tm-chip.on .prog { color: var(--primary-strong); opacity: .75; }

  /* —— 定稿:今日番茄数用数字输入框(比 −/+ 步进器快)—— */
  .tm-plan-field { display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0; }
  /* 沿用项目现有的数字输入样式(panel.css .task-planned-input):
     原生 type=number,自带上下箭头,既能敲也能点 */
  .tm-plan-input {
    width: 46px; padding: 5px 2px 5px 6px; text-align: center;
    font: 400 12px/1.4 var(--font-body); font-variant-numeric: tabular-nums;
    border: 1px solid var(--border-hairline); border-radius: 6px;
    background: var(--surface-card); color: var(--on-neutral);
  }
  .tm-plan-input:focus { outline: none; border-color: var(--primary); }
  .tm-plan-unit { font-size: 12px; line-height: 1; }
  .tm-plan-done {
    font: 400 10px/1.4 var(--font-body); color: var(--on-neutral-muted);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .tm-plan-done b { color: var(--primary); font-weight: 600; }

  /* 点击才变输入框的变体:平时是纯文字 */
  .tm-plan-text {
    display: inline-flex; align-items: center; gap: 4px; cursor: text;
    padding: 3px 6px; border-radius: 5px; border: 1px solid transparent;
    font: 400 12px/1.3 var(--font-body); font-variant-numeric: tabular-nums;
    transition: background .12s, border-color .12s;
  }
  .tm-plan-text:hover { background: rgba(255,255,255,.6); border-color: var(--border-hairline); }

  /* —— Notion 页面 mock(用于展示三种写入方式)—— */
  .nt-page {
    height: 100%; box-sizing: border-box; overflow: hidden;
    background: #ffffff; color: #37352f;
    font: 400 13px/1.6 -apple-system, 'PingFang SC', sans-serif;
    padding: 20px 22px;
  }
  .nt-crumb { font-size: 11px; color: #9b9a97; margin-bottom: 10px; }
  .nt-title { font: 700 22px/1.3 -apple-system, 'PingFang SC', sans-serif; margin-bottom: 14px; }
  .nt-props { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .nt-prop { display: flex; align-items: flex-start; gap: 8px; font-size: 12px; }
  .nt-prop-key { width: 96px; flex-shrink: 0; color: #9b9a97; display: flex; align-items: center; gap: 5px; }
  .nt-prop-val { flex: 1; min-width: 0; color: #37352f; }
  .nt-prop.is-new .nt-prop-key { color: #c24330; font-weight: 600; }
  .nt-prop.is-new .nt-prop-val {
    background: rgba(217,79,58,.08); border-radius: 4px;
    padding: 2px 6px; margin: -2px 0;
  }
  .nt-divider { height: 1px; background: rgba(55,53,47,.09); margin: 14px 0; }
  .nt-h2 { font: 600 15px/1.4 -apple-system, 'PingFang SC', sans-serif; margin: 4px 0 8px; }
  .nt-block { display: flex; align-items: flex-start; gap: 8px; padding: 2px 0; font-size: 13px; }
  .nt-todo-box {
    width: 14px; height: 14px; border: 1.5px solid #9b9a97; border-radius: 3px;
    flex-shrink: 0; margin-top: 3px;
  }
  .nt-meta { color: #9b9a97; font-size: 12px; }
  .nt-tag {
    display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 3px;
    background: #e8e7e4; color: #5f5e5b; margin-left: 4px;
  }
  .nt-tag.study { background: #dbeddb; color: #2f5c34; }
  .nt-tag.work  { background: #d3e5ef; color: #1c3d5a; }
  .nt-marker { color: #9b9a97; font-size: 11px; font-style: italic; padding: 2px 0; }
  .nt-highlight { background: rgba(217,79,58,.10); border-radius: 4px; padding: 6px 8px; margin: 0 -8px; }
  .nt-db {
    border: 1px solid rgba(55,53,47,.12); border-radius: 6px; overflow: hidden; margin-top: 6px;
  }
  .nt-db-head, .nt-db-row { display: flex; font-size: 12px; }
  .nt-db-head { background: #f7f6f3; color: #9b9a97; font-weight: 500; }
  .nt-db-row { border-top: 1px solid rgba(55,53,47,.08); }
  .nt-db-cell { padding: 6px 9px; flex: 1; min-width: 0; }
  .nt-db-cell.narrow { flex: 0 0 62px; }
  .nt-db-cell.mid { flex: 0 0 78px; }

  /* 设置窗口里的导入按钮与状态 */
  .tm-import-row {
    display: flex; align-items: center; gap: 8px; margin-top: 12px;
    padding-top: 12px; border-top: 1px solid var(--border-hairline);
  }
  .tm-btn-import {
    background: var(--surface-card); color: var(--on-neutral);
    border: 1px solid var(--border-hairline); border-radius: 8px;
    padding: 6px 14px; font: 600 12px/1.4 var(--font-body); cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0;
  }
  .tm-btn-import:hover { box-shadow: var(--elevation-sm); }
  .tm-import-note { font: 400 11px/1.5 var(--font-body); color: var(--on-neutral-muted); }
  .tm-import-note b { color: var(--success); font-weight: 600; }
  .tm-month-pick {
    font: 400 12px/1.4 var(--font-body); padding: 5px 8px;
    border: 1px solid var(--border-hairline); border-radius: 6px;
    background: var(--surface-card); color: var(--on-neutral); flex-shrink: 0;
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="mockups.jsx"></script>
</body>
</html>
